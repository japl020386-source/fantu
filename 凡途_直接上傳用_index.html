<script>
window.addEventListener("error",function(e){
 setTimeout(function(){
  var v=document.getElementById("view");

function clone(x){return JSON.parse(JSON.stringify(x))}
function merge(a,b){for(var k in b){if(typeof a[k]==="undefined"){a[k]=clone(b[k]);continue}if(b[k]!==null&&typeof b[k]==="object"&&!Array.isArray(b[k])){if(a[k]===null||typeof a[k]!=="object")a[k]=clone(b[k]);else merge(a[k],b[k])}}}
function load(){try{var x=JSON.parse(localStorage.getItem("fantu05"));return x||clone(D)}catch(e){return clone(D)}}

function save(){s.lastSeen=Date.now();try{localStorage.setItem("fantu05",JSON.stringify(s))}catch(e){}}
function toast(x){var e=document.getElementById("toast");e.textContent=x;e.style.opacity=1;setTimeout(function(){e.style.opacity=0},1600)}
function hist(x){s.history.unshift("【"+s.age+"歲】"+x);s.history=s.history.slice(0,150)}
function need(){return Math.round((s.realm*100+65)*(1+s.layer*.38))}

function B(t,f,c){return '<button class="btn '+(c||"")+'" onclick="'+f+'">'+t+'</button>'}
function stat(a,b){return '<div class="stat"><small>'+a+'</small><b>'+b+'</b></div>'}
function top(){return '<div class="panel stats">'+stat("境界",rn())+stat("修為",s.qi+"/"+need())+stat("靈石",s.stones)+stat("靈根",s.root)+stat("宗門貢獻",s.contrib)+stat("壽元",s.age+"/"+s.lifespan)+'</div>'}
window.goPage=function(p){page=p;render()}
function setScene(){var sc=SCENES[s.loc]||SCENES.village;document.getElementById("scene").style.background=sc.bg}

function intro(){document.getElementById("view").innerHTML='<div class="panel"><div class="title">第一世・青雲村</div><div class="story">大乾王朝，青州邊陲。\n\n十六年來，你只在說書人口中聽過仙人。\n\n直到暴雨夜，一名白衣老者倒在你家門前。他胸口染血，腰間掛著青色儲物袋。\n\n遠處，追殺者的腳步聲越來越近。</div>'+B("先救人，再問來歷","start(1)","good")+B("取走儲物袋，再將人藏起","start(-1)")+B("關門。不沾這場因果","start(0)")+'</div>'}
window.start=function(c){s.karma=c;s.flags.elder=c!==0;var r=Math.random()*100;s.root=r<3?"天靈根":r<10?"異靈根":r<28?"雙靈根":r<62?"三靈根":"五靈根";s.realm=1;s.layer=1;s.lifespan=125;s.loc="gate";s.stage="game";hist("測靈大典，測出「"+s.root+"」，踏入煉氣。");if(s.root==="五靈根"){s.flags.five=true;hist("靈根駁雜，被執事評為下等資質。")}if(c===1){s.luck+=2;hist("白衣老者臨別贈你一枚無字玉牌。")}render()}

window.choiceTalk=function(id,c){s.relations[id]=(s.relations[id]||0)+1;
if(id==="lin"&&c==="learn"){if(s.relations.lin>=3&&s.knownTechs.indexOf("寒泉劍訣")<0){s.knownTechs.push("寒泉劍訣");toast("林清霜傳你《寒泉劍訣》")}else toast("她指出你劍招中的三處破綻")}
if(id==="lin"&&c==="gift"){if(s.inv.靈草>0){s.inv.靈草--;s.relations.lin+=2;toast("好感提升")}else toast("你沒有靈草")}
if(id==="han"&&c==="job"){s.contrib+=6;s.stones+=20;hist("韓執事給了你一件急務。");toast("貢獻 +6")}
if(id==="han"&&c==="secret"){s.flags.secret=true;toast("得知秘境入口線索")}
if(id==="old"&&c==="five"&&s.flags.five&&s.knownTechs.indexOf("殘缺五行訣")<0){s.knownTechs.push("殘缺五行訣");toast("獲得《殘缺五行訣》")}
if(id==="old"&&c==="tech"){toast("老人：先把手上的路走穩。")}
if(id==="dan"&&c==="pill"){if(s.contrib>=15){s.contrib-=15;s.recipes.築基丹=true;toast("習得築基丹方")}else toast("需要 15 宗門貢獻")}
if(id==="tie"&&c==="affix"){s.inv.洗鍊石++;toast("鐵山丟給你一顆洗鍊石")}
if(id==="tie"&&c==="divine"){toast("神兵？先學會把凡鐵錘好。")}

if(id==="sword"&&c==="observe"){if(s.relations.sword>=3&&s.knownTechs.indexOf("太虛劍典・殘頁")<0){s.knownTechs.push("太虛劍典・殘頁");toast("你記下了一縷太虛劍意")}else toast("劍意太深，你只看懂一絲")}

hist("與 "+id+" 交談。");save();talk(id)}
window.closeModal=function(){document.getElementById("modal").innerHTML="";render()}
window.mission=function(){var r=Math.random();if(r<.33){s.contrib+=10;s.stones+=35;hist("護送靈藥車隊，獲貢獻10。");toast("任務完成")}else if(r<.66){s.contrib+=8;s.inv.靈草+=3;hist("整理靈田，獲貢獻8。");toast("獲得靈草")}else{hist("接下萬獸林獵妖任務。");toast("去萬獸林斬妖")};render()}
window.showTechs=function(){var out="";for(var k in TECHS){var t=TECHS[k],known=s.knownTechs.indexOf(k)>=0;out+='<div class="item"><b class="r'+Math.min(5,t.tier)+'">'+k+'</b> <span class="tag">'+t.type+'</span><br><small>'+t.desc+'</small><span class="aff">'+t.bonus+'</span>'+(known?'<div class="tag">已習得</div>':(t.cost>0?B("用貢獻換取（"+t.cost+"）","learnTech(\''+k+'\')"):'<div class="tag">特殊機緣</div>'))+'</div>'}document.getElementById("modal").innerHTML='<div class="overlay"><div class="card"><div class="title">藏經閣・功法目錄</div>'+out+B("離開","closeModal()")+'</div></div>'}
window.learnTech=function(name){var t=TECHS[name];if(!t||s.knownTechs.indexOf(name)>=0)return;if(s.contrib<t.cost){toast("貢獻不足");return}s.contrib-=t.cost;s.knownTechs.push(name);hist("習得《"+name+"》。");toast("習得 "+name);showTechs()}
function cultivate(){var opts="";for(var i=0;i<s.knownTechs.length;i++){var x=s.knownTechs[i];if(TECHS[x]&&TECHS[x].type==="心法")opts+=B((s.tech===x?"✓ ":"")+"運轉《"+x+"》","setTech(\''+x+'\')")}return '<div class="panel"><div class="title">洞府修行</div><div class="story">當前心法：<b>'+s.tech+'</b>\n生命 '+s.hp+'/'+s.maxhp+'　靈力 '+s.mp+'/'+s.maxmp+'\n\n閉關會推進歲月。境界越高，突破越艱難。</div><div class="bar hp"><i style="width:'+(s.hp/s.maxhp*100)+'%"></i></div><div class="bar mp"><i style="width:'+(s.mp/s.maxmp*100)+'%"></i></div>'+B("閉關一月","meditate()")+B("嘗試突破","breakthrough()","good")+'</div><div class="panel"><div class="title">已習得心法</div>'+opts+'</div>'}
window.setTech=function(x){s.tech=x;render();toast("切換心法")}
window.meditate=function(){var root=s.root==="天靈根"?1.7:s.root==="異靈根"?1.45:s.root==="雙靈根"?1.25:s.root==="五靈根"?.78:1;var tech=s.tech==="青玄引氣篇"?1.25:s.tech==="殘缺五行訣"?1.08:1;var g=Math.floor((18+Math.random()*15)*root*tech);s.qi+=g;s.passXP+=4;s.age+=Math.random()<.16?1:0;s.mp=s.maxmp;hist("閉關吐納，修為 +"+g+"。");render();toast("修為 +"+g)}
window.breakthrough=function(){if(s.qi<need()){toast("修為尚未圓滿");return}var ch=.9-s.realm*.035;if(s.realm===1&&s.layer===4&&s.inv.築基丹>0){s.inv.築基丹--;ch+=.12}if(Math.random()>ch){s.qi=Math.floor(s.qi*.35);s.hp=Math.max(20,s.hp-25);hist("突破失敗，經脈受創。");render();toast("突破失敗");return}s.qi-=need();if(s.layer<4)s.layer++;else if(s.realm<9){s.realm++;s.layer=1;s.maxhp+=35;s.hp=s.maxhp;s.maxmp+=20;s.mp=s.maxmp;s.lifespan+=55+s.realm*25;s.atk+=10*s.realm;s.def+=6*s.realm;if(s.realm>=2)s.flags.inner=true;if(s.realm===2&&s.flags.five&&s.tech==="殘缺五行訣"){hist("五氣匯海，凝成「五行道基」！");s.luck+=6}}s.passXP+=20;hist("破境成功，踏入 "+rn()+"。");render();toast("破境成功！")}
var AFFIXES=[
{name:"攻擊",key:"atk",min:3,max:12,suffix:""}, {name:"防禦",key:"def",min:2,max:9,suffix:""}, {name:"氣血",key:"hp",min:20,max:90,suffix:""},
{name:"靈力",key:"mp",min:15,max:65,suffix:""}, {name:"暴擊率",key:"crit",min:2,max:7,suffix:"%"}, {name:"閃避率",key:"dodge",min:2,max:6,suffix:"%"},
{name:"劍法傷害",key:"sword",min:5,max:16,suffix:"%"}, {name:"火系傷害",key:"fire",min:5,max:16,suffix:"%"}, {name:"修煉效率",key:"cult",min:2,max:8,suffix:"%"}
];
var WEAPONS=["青竹劍","玄鐵劍","流雲劍","赤炎刀","破山刀","寒月槍","鎮岳棍","靈木法杖","青羽扇","雷紋指套","獸骨長弓"];
var ARMORS=["青紋道袍","玄鐵內甲","流雲法衣","赤炎戰袍","寒泉護甲","獸皮戰衣","靈木護身衣"];
var ACCESSORIES=["青玉佩","聚靈戒","凝神珠","赤火墜","寒泉玉","獸魂環"];
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function makeGear(slot,bonus){var rar=Math.min(5,Math.max(1,(bonus||1)+(Math.random()<.2?1:0)+(Math.random()<.06?1:0)));var names=slot==="weapon"?WEAPONS:slot==="armor"?ARMORS:ACCESSORIES;var g={name:names[rand(0,names.length-1)],slot:slot,rarity:rar,base:{},affixes:[]};if(slot==="weapon")g.base.atk=rand(5,10)+rar*5;if(slot==="armor")g.base.def=rand(3,7)+rar*4;if(slot==="accessory")g.base.hp=20+rar*18;var count=Math.min(5,Math.max(0,rar-1));for(var i=0;i<count;i++){var p=AFFIXES[rand(0,AFFIXES.length-1)],v=rand(p.min,p.max)+rar;g.affixes.push({name:p.name,key:p.key,value:v,suffix:p.suffix})}return g}
function gearStats(g){var o={atk:0,def:0,hp:0,mp:0,crit:0,dodge:0};if(!g)return o;for(var k in g.base)if(typeof o[k]!=="undefined")o[k]+=g.base[k];for(var i=0;i<g.affixes.length;i++){var a=g.affixes[i];if(typeof o[a.key]!=="undefined")o[a.key]+=a.value}return o}
function totalStats(){var o={atk:s.atk,def:s.def,hp:s.maxhp,mp:s.maxmp,crit:s.crit,dodge:s.dodge};["weapon","armor","accessory","artifact"].forEach(function(sl){var x=gearStats(s.gear[sl]);for(var k in x)o[k]+=x[k]});return o}
function gearCard(g,i){if(!g)return "";var aff="";for(var j=0;j<g.affixes.length;j++){var a=g.affixes[j];aff+='<span class="aff">＋'+a.name+' '+a.value+a.suffix+'</span>'}var base="";for(var k in g.base)base+='<span class="aff">基礎 '+k.toUpperCase()+' +'+g.base[k]+'</span>';return '<div class="item"><b class="r'+g.rarity+'">'+["","凡品","良品","上品","極品","古品"][g.rarity]+'・'+g.name+'</b>'+base+aff+(typeof i==="number"?B("裝備","equipGear("+i+")","good"):"")+'</div>'}
function gearPage(){var ts=totalStats(),bag="";for(var i=0;i<s.gearBag.length;i++)bag+=gearCard(s.gearBag[i],i);return '<div class="panel"><div class="title">當前裝備</div>'+gearCard(s.gear.weapon)+gearCard(s.gear.armor)+gearCard(s.gear.accessory)+gearCard(s.gear.artifact)+'</div><div class="panel"><div class="title">總屬性</div><div class="grid3">'+stat("攻擊",ts.atk)+stat("防禦",ts.def)+stat("氣血",ts.hp)+stat("靈力",ts.mp)+stat("暴擊",ts.crit+"%")+stat("閃避",ts.dodge+"%")+'</div></div><div class="panel"><div class="title">裝備袋</div>'+(bag||'<div class="story">尚無多餘裝備。去萬獸林、古域或秘境碰碰運氣。</div>')+'</div>'}
window.equipGear=function(i){var g=s.gearBag[i];if(!g)return;var old=s.gear[g.slot];s.gear[g.slot]=g;s.gearBag.splice(i,1);if(old)s.gearBag.push(old);hist("裝備「"+g.name+"」。");render();toast("已裝備")}
window.explore=function(){var danger=s.loc==="secret"?4:s.loc==="ruins"?3:s.loc==="beastForest"?2:1;var r=Math.random();s.passXP+=3+danger;if(r<.18){s.inv.靈草+=danger;toast("採得靈草")}else if(r<.32){s.inv.玄鐵+=danger;s.inv.靈木++;toast("取得煉器材料")}else if(r<.43){var g=makeGear(Math.random()<.5?"weapon":Math.random()<.6?"armor":"accessory",Math.min(4,danger));s.gearBag.push(g);hist("探索得到「"+g.name+"」。");toast("掉落裝備！")}else if(r<.5&&danger>=3){s.inv.洗鍊石++;toast("得到洗鍊石")}else battle(danger);render()}
window.market=function(){if(s.stones<80){toast("靈石不足");return}s.stones-=80;s.inv.靈草+=4;s.inv.玄鐵+=2;s.inv.靈木+=1;toast("購入材料包");render()}
function battle(risk){var names=["青牙狼","赤尾妖狐","鐵背猿","噬靈蟒","血角犀","幽影豹"];var e={name:names[rand(0,names.length-1)],hp:70+risk*55+s.realm*20,maxhp:70+risk*55+s.realm*20,atk:10+risk*8+s.realm*5,def:3+risk*4};window.enemy=e;window.combatLog=[];showBattle()}
window.battle=battle;
function knownBattleSkills(){var a=["普通攻擊"];if(s.knownTechs.indexOf("御氣斬")>=0)a.push("御氣斬");if(s.knownTechs.indexOf("青木回春術")>=0)a.push("青木回春術");if(s.knownTechs.indexOf("烈火印")>=0)a.push("烈火印");if(s.knownTechs.indexOf("寒泉劍訣")>=0)a.push("寒泉劍訣");if(s.knownTechs.indexOf("破岳刀法")>=0)a.push("破岳刀法");if(s.knownTechs.indexOf("驚雷指")>=0)a.push("驚雷指");return a}
function showBattle(){var e=enemy,ts=totalStats(),skills=knownBattleSkills(),btns="";for(var i=0;i<skills.length;i++)btns+=B(skills[i],"turn('"+skills[i]+"')",i?"blue":"");btns+=B("服回春丹","turn('pill')","good")+B("逃離戰鬥","turn('run')","danger");document.getElementById("modal").innerHTML='<div class="overlay"><div class="card"><div class="enemy">'+e.name+'</div><div class="bar hp"><i style="width:'+(e.hp/e.maxhp*100)+'%"></i></div><div class="subtitle">敵 HP '+Math.max(0,e.hp)+'/'+e.maxhp+'</div><hr style="border-color:#39342a"><b>'+rn()+'</b><div class="bar hp"><i style="width:'+(s.hp/ts.hp*100)+'%"></i></div><div class="bar mp"><i style="width:'+(s.mp/ts.mp*100)+'%"></i></div><div class="skill">'+btns+'</div><div class="log">'+combatLog.slice(-7).join("<br>")+'</div></div></div>'}
window.turn=function(a){var e=enemy,ts=totalStats(),acted=false;
if(a==="run"){if(Math.random()<.65+ts.dodge/200){closeModal();toast("成功脫離");return}else combatLog.push("逃跑失敗！")}
if(a==="pill"){if(s.inv.回春丹>0){s.inv.回春丹--;s.hp=Math.min(ts.hp,s.hp+55);combatLog.push("你服下回春丹。");acted=true}else combatLog.push("沒有回春丹。")}
var dmg=0,cost=0,mult=1;if(a==="普通攻擊"){mult=1;acted=true}if(a==="御氣斬"){mult=1.7;cost=20;acted=true}if(a==="烈火印"){mult=2.15;cost=30;acted=true}if(a==="寒泉劍訣"){mult=1.9;cost=24;acted=true}if(a==="破岳刀法"){mult=2.0;cost=25;acted=true}if(a==="驚雷指"){mult=2.4;cost=36;acted=true}
if(a==="青木回春術"){cost=28;if(s.mp>=cost){s.mp-=cost;s.hp=Math.min(ts.hp,s.hp+Math.floor(ts.hp*.28));combatLog.push("青木靈氣流轉，傷勢恢復。");acted=true}else combatLog.push("靈力不足。")}
if(mult>1||a==="普通攻擊"){if(s.mp<cost){combatLog.push("靈力不足。");acted=false}else{if(cost)s.mp-=cost;dmg=Math.max(1,Math.floor((ts.atk+rand(0,10))*mult)-e.def);var crit=Math.random()<ts.crit/100;if(crit)dmg=Math.floor(dmg*1.6);e.hp-=dmg;combatLog.push((crit?"暴擊！":"")+a+"造成 "+dmg+" 傷害。")}}
if(e.hp<=0){s.kills++;s.inv.妖丹++;s.stones+=25+rand(0,45);s.qi+=18+s.realm*5;s.passXP+=10;if(Math.random()<.35){var g=makeGear(Math.random()<.5?"weapon":Math.random()<.7?"armor":"accessory",Math.min(4,Math.max(1,s.realm)));s.gearBag.push(g);hist("斬殺 "+e.name+"，掉落「"+g.name+"」。");toast("勝利＋裝備掉落")}else toast("戰鬥勝利");closeModal();return}
if(acted){if(Math.random()>=ts.dodge/100){var ed=Math.max(1,e.atk+rand(0,8)-ts.def);s.hp-=ed;combatLog.push(e.name+" 反擊，造成 "+ed+" 傷害。")}else combatLog.push("你閃過了攻擊！")}
if(s.hp<=0){s.hp=1;s.loc="outer";hist("遭 "+e.name+" 重創，被巡山弟子救回。");closeModal();toast("重傷敗退");return}showBattle()}
function craft(){return '<div class="panel"><div class="title">煉丹</div>'+B("回春丹｜靈草×3","makePill('heal')")+B("築基丹｜靈草×6 妖丹×2 赤炎晶×1","makePill('foundation')")+'</div><div class="panel"><div class="title">煉器</div><div class="story">煉器成品會隨機出現品階與詞條。越高品階，詞條越多。</div>'+B("鍛造隨機武器｜玄鐵×4 靈木×2","forge('weapon')")+B("鍛造隨機護甲｜玄鐵×3 獸骨×2","forge('armor')")+B("洗鍊當前武器詞條｜洗鍊石×1","rerollWeapon()","purple")+'</div>'}
window.makePill=function(t){if(t==="heal"){if(s.inv.靈草<3){toast("材料不足");return}s.inv.靈草-=3;if(Math.random()<.85){s.inv.回春丹++;toast("成丹：回春丹")}else toast("炸爐了……")}else{if(!s.recipes.築基丹){toast("尚未習得築基丹方");return}if(s.inv.靈草<6||s.inv.妖丹<2||s.inv.赤炎晶<1){toast("材料不足");return}s.inv.靈草-=6;s.inv.妖丹-=2;s.inv.赤炎晶--;if(Math.random()<.68){s.inv.築基丹++;toast("成丹：築基丹")}else toast("煉製失敗")};render()}
window.forge=function(slot){if(slot==="weapon"){if(s.inv.玄鐵<4||s.inv.靈木<2){toast("材料不足");return}s.inv.玄鐵-=4;s.inv.靈木-=2}else{if(s.inv.玄鐵<3||s.inv.獸骨<2){toast("材料不足");return}s.inv.玄鐵-=3;s.inv.獸骨-=2}var g=makeGear(slot,2);s.gearBag.push(g);hist("器峰開爐，鍛成「"+g.name+"」。");render();toast("鍛造完成")}
window.rerollWeapon=function(){if(s.inv.洗鍊石<1){toast("沒有洗鍊石");return}if(!s.gear.weapon){toast("未裝備武器");return}s.inv.洗鍊石--;var g=s.gear.weapon;g.affixes=[];var count=Math.min(5,Math.max(1,g.rarity-1));for(var i=0;i<count;i++){var p=AFFIXES[rand(0,AFFIXES.length-1)];g.affixes.push({name:p.name,key:p.key,value:rand(p.min,p.max)+g.rarity,suffix:p.suffix})}hist("洗鍊「"+g.name+"」詞條。");render();toast("詞條已重鑄")}
function pass(){var lv=Math.min(100,1+Math.floor(s.passXP/30));return '<div class="panel"><div class="title">問道仙令・第一季</div><div class="story">等級 <b>'+lv+'/100</b>　道行 '+s.passXP+'\n\n免費軌與 NT$690 進階軌只提供材料、靈石、洗鍊石與收藏內容。神兵、頂級功法與境界無法直接購買。</div><div class="bar"><i style="width:'+((s.passXP%30)/30*100)+'%"></i></div><div class="item"><b>Lv.20</b> 免費：靈草包｜仙令：秘境材料箱</div><div class="item"><b>Lv.50</b> 免費：玄鐵｜仙令：洗鍊石×3＋稀有材料</div><div class="item"><b>Lv.100</b> 免費：稱號｜仙令：太古玄鐵＋限定洞府外觀</div></div><div class="panel"><div class="title">仙緣月契・NT$150</div><div class="story">每日登入：靈石＋境界對應材料。</div>'+B("Alpha：領取今日月契","monthly()")+'</div>'}
window.monthly=function(){var d=new Date().toISOString().slice(0,10);if(s.lastClaim===d){toast("今日已領");return}s.lastClaim=d;s.stones+=300;s.inv.靈草+=3;s.inv.玄鐵++;toast("月契：靈石300＋材料");render()}
function history(){return '<div class="panel"><div class="title">此世仙史</div><div class="story">靈根：'+s.root+'\n境界：'+rn()+'\n心法：'+s.tech+'\n已習功法：'+s.knownTechs.length+' 部\n斬妖：'+s.kills+'\n因果：'+s.karma+'</div></div><div class="panel"><div class="title">生平紀錄</div><div class="log">'+(s.history.join("<br>")||"尚無記載")+'</div></div>'}
function offline(){var now=Date.now(),mins=Math.floor((now-(s.lastSeen||now))/60000);if(mins>=10&&s.stage==="game"){var cap=Math.min(mins,480),g=Math.floor(cap/10)*(3+s.realm);if(g>0){s.qi+=g;setTimeout(function(){toast("離線修行：修為 +"+g)},600)}}}

document.addEventListener("click",function(ev){
  var travel=ev.target.closest ? ev.target.closest("[data-move]") : null;
  if(travel){
    ev.preventDefault();
    window.move(travel.getAttribute("data-move"));
    return;
  }
});
document.addEventListener("touchend",function(ev){
  var travel=ev.target.closest ? ev.target.closest("[data-move]") : null;
  if(travel){
    ev.preventDefault();
    window.move(travel.getAttribute("data-move"));
  }
},{passive:false});

function boot(){
 try{
   window.s=load();
   merge(s,D);
   offline();
   render();
   var v=document.getElementById("view");
   if(!v || !v.innerHTML.trim()) throw new Error("render() 後主畫面仍為空白");
 }catch(err){
   var v=document.getElementById("view");
   if(v){
     var msg=String(err&&err.message||err).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]});
     v.innerHTML='<div class="panel"><div class="title">啟動診斷</div><div class="story"><b>錯誤：</b> '+msg+'<br><br>請把這個畫面截圖給我。</div></div>';
   }
 }
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot);
else boot();
})();
</script></body></html>
