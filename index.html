function clone(x){return JSON.parse(JSON.stringify(x))}
function merge(a,b){for(var k in b){if(typeof a[k]==="undefined"){a[k]=clone(b[k]);continue}if(b[k]!==null&&typeof b[k]==="object"&&!Array.isArray(b[k])){if(a[k]===null||typeof a[k]!=="object")a[k]=clone(b[k]);else merge(a[k],b[k])}}}
function load(){try{var x=JSON.parse(localStorage.getItem("fantu05"));return x||clone(D)}catch(e){return clone(D)}}
function sanitizeState(x){
  if(!x || typeof x!=="object") x=clone(D);
  var aliases={
    "sect":"gate","mount":"gate","qingxuan":"gate","shanmen":"gate",
    "village":"village","gate":"gate","outer":"outer","market":"market",
    "library":"library","dan":"dan","forge":"forge","mountain":"mountain",

    "river":"river","spiritLake":"spiritLake","swordValley":"swordValley",
    "beastForest":"beastForest","ruins":"ruins","inner":"inner","peak":"peak"
  };
  if(typeof x.loc!=="string") x.loc="gate";
  if(aliases[x.loc]) x.loc=aliases[x.loc];
  if(!SCENES[x.loc]) x.loc="gate";
  if(x.stage!=="intro" && x.stage!=="game") x.stage="game";
  return x;
}

function B(t,f,c){return '<button type="button" class="btn '+(c||"")+'" data-action="'+escAttr(f)+'">'+t+'</button>'}

mu_glow:{reply:"木小禾帶你走到那片藥田。白日看來一切正常，只有最靠北的一株靈草，葉尖微微朝南彎。\n\n你記住了這個細節。",flag:"field_glow",rel:1},
mu_work:{reply:"日落後，木小禾塞給你兩株品相普通的靈草。\n\n「工錢。別嫌少，我自己一天也只捨得拿三株。」",item:"靈草",count:2,rel:1},
yu_scale:{reply:"余晚舟把那片青鱗從袖中取出一角。\n\n只是一瞬，你竟感到一股不屬於煉氣妖獸的威壓。\n\n他立刻收起：「現在知道我為什麼不讓你下水了。」",luck:1,flag:"lake_scale"},
yu_sit:{reply:"風從湖面吹來。你第一次沒有急著把這半個時辰換算成能增加多少修為。\n\n離開時，心境反而比閉關後更清明。",qi:10,rel:1},
mo_sword:{reply:"莫掌櫃在紙上寫下一個你沒見過的商會印記。\n\n「若以後在海外見到這個標記，別急著亮出青玄宗身份。」",flag:"foreign_sword",rel:1},
mo_value:{reply:"他把灰鐵環推給你試握。\n\n「你開始會問『適不適合』，而不是只問『強不強』。這比多一件上品法器值錢。」",rel:1},
ning_grave:{reply:"你把那行字記下後，紙條自行燃成灰。\n\n寧紅袖道：「記在腦子裡。若被搜魂，那就自求多福。」",flag:"grave_window",rel:1},
ning_watch:{reply:"她補了一句：「灰袍人左手少一根小指。」\n\n這個細節，也許哪天會救你一命。",flag:"gray_robed",rel:1},
sha_bell:{reply:"沙行客最後只說：「若真聽見鈴聲，堵住耳朵沒用。別回答，別回頭，別數有幾聲。」",flag:"desert_bell",rel:1},
sha_way:{reply:"你終於能從沙脊細微的陰影看出昨夜風向。\n\n沙行客點頭：「至少現在迷路時，你會死得慢一點。」",luck:1,rel:1},
hai_moon:{reply:"海七把話題硬生生斷掉。\n\n「這件事別在船上問第二次。」\n\n他越不肯說，你越確定那不是水手用來嚇新人的故事。",flag:"second_moon",rel:1},
hai_sects:{reply:"你第一次聽到海外『三宗七島』的說法。\n\n青州之外，顯然還有比你想像大得多的修仙世界。",flag:"oversea_sects",rel:1},
lei_show:{reply:"那道黑線過了三息才轟然裂開。\n\n你這才明白，他所謂『快』甚至不是速度，而是結果先到了，聲音才追上。",qi:15,rel:1},
lei_first:{reply:"雷千岳拍著你肩膀：「怕不丟人。怕了還裝不怕，才容易死。」\n\n這句話比他的雷法更容易記。",rel:2},
xue_breath:{reply:"雪無痕把一枚冰符交給你。\n\n「若哪天我三日沒出洞，拿這個去找雷千岳。別自己下去。」",flag:"ice_breath",rel:1},
xue_snow:{reply:"你盯得太久，太陽穴果然開始抽痛。\n\n雪無痕收走雪花：「知道看不懂就停，也是修行。」",qi:8,rel:1},
ghost_three:{reply:"殘魂道人閉上眼。\n\n「第三個錯誤，我現在還不能告訴你。」\n\n「不是不信你，是怕你知道後，連這片葬地都走不出去。」",flag:"third_mistake",rel:1},
ghost_wait:{reply:"他望著山門外很久。\n\n「如果你有一天在別處看見一枚裂成兩半的黑玉宗令，帶回來給我。」",flag:"black_token",rel:1},
lin_route:{reply:"你追問那名失蹤弟子的名字。\n\n林清霜卻搖頭。\n\n「先別知道。名字會讓你好奇，好奇會讓你去找。」\n\n她看著你：「等你至少能在我手上撐十招，我再告訴你。」",rel:1},
lin_sword:{reply:"她讓你重新起手七次。第七次，劍鞘沒有再敲下來。\n\n「勉強。」\n\n對林清霜而言，這兩個字大概已經算誇獎。",qi:12,rel:1},
han_danger:{reply:"韓執事把灰色玉簡塞進你手裡，又立刻按住。\n\n「最後問一次。接了，就別指望我因為你年輕替你改難度。」\n\n你點頭後，他才鬆手。",contrib:3,flag:"beast_migration"},
han_safe:{reply:"挑水比你想的更累。靈田的水不能用法術亂搬，只能沿陣紋一桶桶送。\n\n傍晚，韓執事看著你濕透的衣服，只說：「很好。至少你不是只會挑漂亮任務的人。」",contrib:5,stones:18},
old_eye:{reply:"你忽然意識到，這老人可能從第一次見面起，就把你的每一個小動作都看在眼裡。\n\n他又低下頭：「別緊張。我若真想害你，你現在才開始緊張也晚了。」",rel:1},
old_mind:{reply:"那杯冷茶的苦味一直留到你走出藏經閣。\n\n奇怪的是，你原本卡了數日的一處行氣節奏，反而在不再強求後自然順了。",qi:18},
dan_listen:{reply:"你真的被留在丹房燒了一下午水。\n\n丹辰子最後只問：「沸騰前一息，聲音變了沒有？」\n\n這一次，你聽見了。",rel:1,flag:"hear_cauldron"},
dan_found:{reply:"他在紙上畫了三個圈，又全部抹掉。\n\n「等你真到煉氣大圓滿，再來。我現在教太多，你只會把自己嚇得不敢築基。」",rel:1},
tie_affix:{reply:"鐵山把兩把外形一模一樣的短劍丟在桌上。\n\n一把冰冷，一把握住時竟有微微暖意。\n\n「同樣材料，同一個爐。最後一錘，兩個器師心裡想的東西不同。」",item:"洗鍊石",count:1},
tie_divine:{reply:"鐵山把爐門關上，火光在他臉上一閃。\n\n「我見過一柄劍，主人死後三百年都沒讓第二個人碰。」\n\n「浪漫嗎？」\n\n他冷笑：「也可能只是脾氣差。」",rel:1},
merchant_info:{reply:"蘇九娘把三根手指全收回去。\n\n「還有第四種：你明明知道，卻願意假裝不知道的消息。那種通常最貴。」",luck:1},
merchant_shop:{reply:"她把茶推到你面前。\n\n「第三課免費送你：同一件東西，若賣家一直催你今天決定，那真正怕錯過的人通常不是你，是他。」",stones:20},
zhao_three:{reply:"三招結束後，趙無鋒大笑著拍你肩膀。\n\n「這才對。修為是你有多少力，打架是你知不知道什麼時候用。」",qi:15,rel:1},
zhao_reason:{reply:"他說完後像覺得自己太正經，立刻咧嘴補了一句：「當然，能順便揍討厭的人也很好。」",rel:2},
sword_guard:{reply:"白衣劍客轉回身。\n\n「下次別急著說給我聽。」\n\n「先問自己，身後那個人值不值得你死。」\n\n谷風重新吹動，你卻覺得這句比劍氣更冷。",qi:22,flag:"sword_guard"},
sword_live:{reply:"他點頭。\n\n「修仙界太多人會教你怎麼死得像個英雄，很少有人教你怎麼活得不難看。」",luck:1,flag:"sword_live"},
inner_path:{reply:"顧長青看向遠處。\n\n「別把別人的後悔當成你的答案。我的路走錯過，所以我更不敢替你選。」",qi:10,rel:1},
inner_debt:{reply:"「所以收人東西前想清楚。」\n\n顧長青拍了拍你肩膀。\n\n「免費的丹藥、免費的指點、免費的人情，最後都有人來結帳。」",rel:1}
};

function npcName(id){
 for(var loc in NPCS){var arr=NPCS[loc]||[];for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i].name}
 return "無名修士";
}
function nextNpcText(id){if(!s.talkCount)s.talkCount={};var arr=NOVEL_DIALOGUE[id]?NOVEL_DIALOGUE[id].lines:(NPC_SHORT[id]||["對方只是朝你點了點頭。"]);var n=s.talkCount[id]||0;s.talkCount[id]=n+1;return arr[n%arr.length];}
function maybeFate(id){if(!NOVEL_DIALOGUE[id]||!NOVEL_DIALOGUE[id].fate)return "";if(!s.fateSeen)s.fateSeen={};if(s.fateSeen[id])return "";var n=s.talkCount[id]||0,rel=s.relations[id]||0;if(n<3||rel<1)return "";var chance=Math.min(.55,.18+rel*.08+s.luck*.015);if(Math.random()>chance)return "";s.fateSeen[id]=true;if(id==="lin"||id==="zhao"||id==="sword"||id==="inner")s.qi+=20;if(id==="dan")s.inv.回春丹=(s.inv.回春丹||0)+1;if(id==="tie")s.inv.洗鍊石=(s.inv.洗鍊石||0)+1;if(id==="merchant")s.stones+=66;if(id==="han")s.flags.secret=true;hist("【人物機緣】"+NOVEL_DIALOGUE[id].fate.replace(/\n/g," "));return "\n\n──── 人物機緣 ────\n"+NOVEL_DIALOGUE[id].fate;}
function storyOptions(id){
 var out="",choices=NOVEL_DIALOGUE[id]?NOVEL_DIALOGUE[id].choices:(NPC_BRANCHES[id]||[]);
 for(var i=0;i<choices.length;i++){var c=choices[i];out+='<button type="button" class="btn npc-choice" data-npc="'+escAttr(id)+'" data-choice="'+escAttr(c[2])+'">'+c[0]+'</button>'}
 if(!choices.length)out+='<button type="button" class="btn npc-talk" data-npc="'+escAttr(id)+'">再聊一會</button>';
 return out;
}

function people(){var arr=NPCS[s.loc]||[],out="";if(!arr.length)out='<div class="story">此地暫無重要人物。四處走走，也許會遇見新的因果。</div>';for(var i=0;i<arr.length;i++){var n=arr[i];out+='<div class="item"><b>'+n.name+'</b> <span class="tag">'+n.title+'</span><br><small>'+n.desc+'</small><br><small>好感：'+(s.relations[n.id]||0)+'</small><button type="button" class="btn npc-talk" data-npc="'+escAttr(n.id)+'">交談</button></div>'}return '<div class="panel"><div class="title">附近人物</div>'+out+'</div>'}
window.talk=function(id){var name=npcName(id);var body=nextNpcText(id);s.relations[id]=(s.relations[id]||0)+1;body+=maybeFate(id);save();document.getElementById("modal").innerHTML='<div class="overlay"><div class="card"><div class="npc">'+name+'</div><div class="story">'+body+'</div>'+storyOptions(id)+B("先告辭","closeModal()")+'</div></div>';};
window.storyChoice=function(id,key){var e=STORY_CHOICE[key];if(!e){toast("這段對話尚未開放");return}s.relations[id]=(s.relations[id]||0)+(e.rel||1);if(e.qi)s.qi+=e.qi;if(e.contrib)s.contrib+=e.contrib;if(e.stones)s.stones+=e.stones;if(e.luck)s.luck+=e.luck;if(e.flag)s.storyFlags[e.flag]=true;if(e.item)s.inv[e.item]=(s.inv[e.item]||0)+(e.count||1);hist("與"+npcName(id)+"的一次交談改變了某些事情。");save();document.getElementById("modal").innerHTML='<div class="overlay"><div class="card"><div class="npc">'+npcName(id)+'</div><div class="story">'+e.reply+'</div><button type="button" class="btn blue npc-talk" data-npc="'+escAttr(id)+'">繼續聊</button>'+B("記下這件事，告辭","closeModal()")+'</div></div>';};
window.closeModal=function(){document.getElementById("modal").innerHTML="";render()}
window.mission=function(){var r=Math.random();if(r<.33){s.contrib+=10;s.stones+=35;hist("護送靈藥車隊，獲貢獻10。");toast("任務完成")}else if(r<.66){s.contrib+=8;s.inv.靈草+=3;hist("整理靈田，獲貢獻8。");toast("獲得靈草")}else{hist("接下萬獸林獵妖任務。");toast("去萬獸林斬妖")};render()}
window.showTechs=function(){var out="";for(var k in TECHS){var t=TECHS[k],known=s.knownTechs.indexOf(k)>=0;out+='<div class="item"><b class="r'+Math.min(5,t.tier)+'">'+k+'</b> <span class="tag">'+t.type+'</span><br><small>'+t.desc+'</small><span class="aff">'+t.bonus+'</span>'+(known?'<div class="tag">已習得</div>':(t.cost>0?'<button type="button" class="btn learn-tech" data-tech="'+escAttr(k)+'">用貢獻換取（'+t.cost+'）</button>':'<div class="tag">特殊機緣</div>'))+'</div>'}document.getElementById("modal").innerHTML='<div class="overlay"><div class="card"><div class="title">藏經閣・功法目錄</div><div class="subtitle">目前宗門貢獻：'+s.contrib+'</div>'+out+B("離開","closeModal()")+'</div></div>'}
window.learnTech=function(name){var t=TECHS[name];if(!t||s.knownTechs.indexOf(name)>=0)return;if(s.contrib<t.cost){toast("貢獻不足");return}s.contrib-=t.cost;s.knownTechs.push(name);hist("習得《"+name+"》。");toast("習得 "+name);showTechs()}

function returnEvent(){var r=Math.random();if(r<.15){s.stones+=28;return "歸途中，你替一支被山匪纏上的凡人商隊解了圍。商隊掌櫃堅持塞給你二十八枚靈石。";}if(r<.28){s.qi+=12;return "山腰忽起雲海，你在崖邊停了一刻鐘。某個一直想不通的行氣節點，竟在那一刻自行通順。";}if(r<.39){s.inv.靈草=(s.inv.靈草||0)+1;return "路過一片背陰山坡時，你聞到淡淡藥香，找到一株尚未被採走的靈草。";}if(r<.47){s.hp=Math.max(1,s.hp-8);return "你抄近路時驚動了一窩赤尾蜂。雖然脫身不難，手背還是腫了半天。";}return "";}
window.returnSect=function(){var from=(SCENES[s.loc]&&SCENES[s.loc].name)||"外地";var ev=returnEvent();s.loc="cave";hist("從「"+from+"」踏上歸途，返回青玄宗弟子洞府。"+(ev?(" "+ev):""));save();render();toast(ev?"歸宗途中發生了一件事":"已回到青玄宗洞府");};
window.restAtSect=function(){var ts=totalStats();s.hp=ts.hp;s.mp=ts.mp;var roll=Math.random(),extra="";if(roll<.18){s.qi+=8;extra="夜裡醒來時，你忽然想通白日戰鬥中的一處失誤，修為略有精進。";}else if(roll<.30){s.inv.回春丹=(s.inv.回春丹||0)+1;extra="丹峰弟子送錯了一瓶丹藥，發現時已懶得拿回去，便留給了你。";}hist("在宗門洞府休養三日。氣血與靈力盡復。"+extra);save();render();toast("休養完成・狀態全滿");};
window.shortRetreat=function(){var root=s.root==="天靈根"?1.65:s.root==="異靈根"?1.4:s.root==="雙靈根"?1.22:s.root==="五靈根"?.82:1;var base=30+Math.floor(Math.random()*23),gain=Math.floor(base*root);var note="";var r=Math.random();if(r<.12){gain+=18;note="閉關第四日，聚靈陣中的靈氣忽然形成一個小旋渦，你順勢多運轉了三個周天。";}else if(r<.21){gain=Math.max(10,gain-10);note="這七日心緒不寧，幾次入定都被雜念打斷。你沒有強行修煉。";}else{note="七日裡沒有異象，也沒有頓悟。你只是把每一次吐納都做得比前一次更穩。";}s.qi+=gain;s.passXP+=4;s.mp=s.maxmp;hist("在宗門洞府閉關七日，修為 +"+gain+"。"+note);save();render();toast("七日閉關・修為 +"+gain);};
window.homeJournal=function(){var recent=s.history.slice(0,6).join("<br>")||"洞府石桌上還沒有留下值得記錄的事情。";document.getElementById("modal").innerHTML='<div class="overlay"><div class="card"><div class="title">洞府札記</div><div class="story">回到自己的地方後，外面的事才終於有時間慢慢想。<br><br>'+recent+'</div>'+B("收起札記","closeModal()")+'</div></div>';};

function cultivate(){var opts="";var atSect=["gate","outer","cave","mission","library","dan","forge","field","arena","inner","peak","starTerrace","thunderPeak"].indexOf(s.loc)>=0;var homeBox=atSect?'<div class="panel"><div class="title">宗門生活</div><div class="story">身在青玄宗，至少今晚不用擔心半夜有妖獸撞開門。真正適合長時間休養與閉關的地方，是自己的洞府。</div>'+B("回洞府休養三日","restAtSect()","good")+B("閉關七日","shortRetreat()","blue")+'</div>':'<div class="panel"><div class="title">人在外地</div><div class="story">野外可以打坐恢復，但真正閉關最好先回宗門。修士最忌在最脆弱的入定時，把命交給一片陌生山林。</div>'+B("啟程回青玄宗","returnSect()","good")+'</div>';for(var i=0;i<s.knownTechs.length;i++){var x=s.knownTechs[i];if(TECHS[x]&&TECHS[x].type==="心法")opts+=B((s.tech===x?"✓ ":"")+"運轉《"+x+"》","setTech(\''+x+'\')")}return homeBox+'<div class="panel"><div class="title">洞府修行</div><div class="story">當前心法：<b>'+s.tech+'</b>\n生命 '+s.hp+'/'+s.maxhp+'　靈力 '+s.mp+'/'+s.maxmp+'\n\n閉關會推進歲月。境界越高，突破越艱難。</div><div class="bar hp"><i style="width:'+(s.hp/s.maxhp*100)+'%"></i></div><div class="bar mp"><i style="width:'+(s.mp/s.maxmp*100)+'%"></i></div>'+B("閉關一月","meditate()")+B("嘗試突破","breakthrough()","good")+'</div><div class="panel"><div class="title">已習得心法</div>'+opts+'</div>'}
window.setTech=function(x){s.tech=x;render();toast("切換心法")}
window.meditate=function(){var root=s.root==="天靈根"?1.7:s.root==="異靈根"?1.45:s.root==="雙靈根"?1.25:s.root==="五靈根"?.78:1;var tech=s.tech==="青玄引氣篇"?1.25:s.tech==="殘缺五行訣"?1.08:1;var g=Math.floor((18+Math.random()*15)*root*tech);s.qi+=g;s.passXP+=4;s.age+=Math.random()<.16?1:0;s.mp=s.maxmp;hist("閉關吐納，修為 +"+g+"。");render();toast("修為 +"+g)}
window.breakthrough=function(){if(s.qi<need()){toast("修為尚未圓滿");return}var ch=.9-s.realm*.035;if(s.realm===1&&s.layer===4&&s.inv.築基丹>0){s.inv.築基丹--;ch+=.12}if(Math.random()>ch){s.qi=Math.floor(s.qi*.35);s.hp=Math.max(20,s.hp-25);hist("突破失敗，經脈受創。");render();toast("突破失敗");return}s.qi-=need();if(s.layer<4)s.layer++;else if(s.realm<9){s.realm++;s.layer=1;s.maxhp+=35;s.hp=s.maxhp;s.maxmp+=20;s.mp=s.maxmp;s.lifespan+=55+s.realm*25;s.atk+=10*s.realm;s.def+=6*s.realm;if(s.realm>=2)s.flags.inner=true;if(s.realm===2&&s.flags.five&&s.tech==="殘缺五行訣"){hist("五氣匯海，凝成「五行道基」！");s.luck+=6}}s.passXP+=20;hist("破境成功，踏入 "+rn()+"。");render();toast("破境成功！")}
var AFFIXES=[
{name:"攻擊",key:"atk",min:3,max:12,suffix:""}, {name:"防禦",key:"def",min:2,max:9,suffix:""}, {name:"氣血",key:"hp",min:20,max:90,suffix:""},
{name:"靈力",key:"mp",min:15,max:65,suffix:""}, {name:"暴擊率",key:"crit",min:2,max:7,suffix:"%"}, {name:"閃避率",key:"dodge",min:2,max:6,suffix:"%"},

window.settleAuction=function(){
 var list=s.auctionListings||[],remain=[],sold=0,gain=0;
 for(var i=0;i<list.length;i++){
  var x=list[i],base=gearValue(x.gear),ratio=x.price/base,chance=ratio<=.95?.9:ratio<=1.25?.72:ratio<=1.6?.42:.22;

   var net=Math.floor(x.price*.9);s.stones+=net;sold++;gain+=net;

function runAction(code){

  if((m=code.match(/^goPage\((['"])(.*?)\1\)$/))) return window.goPage(m[2]);
  if((m=code.match(/^start\((-?\d+)\)$/))) return window.start(Number(m[1]));
  if((m=code.match(/^talk\((['"])(.*?)\1\)$/))) return window.talk(m[2]);
  if((m=code.match(/^storyChoice\((['"])(.*?)\1,(['"])(.*?)\3\)$/))) return window.storyChoice(m[2],m[4]);
  if((m=code.match(/^learnTech\((['"])(.*?)\1\)$/))) return window.learnTech(m[2]);
  if((m=code.match(/^setTech\((['"])(.*?)\1\)$/))) return window.setTech(m[2]);
  if((m=code.match(/^battle\((\d+)\)$/))) return window.battle(Number(m[1]));
  if((m=code.match(/^turn\((['"])(.*?)\1\)$/))) return window.turn(m[2]);
  if((m=code.match(/^makePill\((['"])(.*?)\1\)$/))) return window.makePill(m[2]);
  if((m=code.match(/^forge\((['"])(.*?)\1\)$/))) return window.forge(m[2]);
  if((m=code.match(/^equipGear\((\d+)\)$/))) return window.equipGear(Number(m[1]));
  var simple={
    "explore()":window.explore,"mission()":window.mission,"showTechs()":window.showTechs,
    "market()":window.market,"meditate()":window.meditate,"breakthrough()":window.breakthrough,
    "rerollWeapon()":window.rerollWeapon,"monthly()":window.monthly,"closeModal()":window.closeModal,"returnSect()":window.returnSect,"restAtSect()":window.restAtSect,"shortRetreat()":window.shortRetreat,"homeJournal()":window.homeJournal,"auctionHouse()":window.auctionHouse,"settleAuction()":window.settleAuction
  };
  if(simple[code]) return simple[code]();
  toast("按鈕指令錯誤");
}
document.addEventListener("click",function(ev){
  var npcBtn=ev.target.closest ? ev.target.closest(".npc-talk") : null;
  if(npcBtn){ev.preventDefault();window.talk(npcBtn.getAttribute("data-npc"));return}
  var choiceBtn=ev.target.closest ? ev.target.closest(".npc-choice") : null;
  if(choiceBtn){ev.preventDefault();window.storyChoice(choiceBtn.getAttribute("data-npc"),choiceBtn.getAttribute("data-choice"));return}
  var techBtn=ev.target.closest ? ev.target.closest("[data-tech]") : null;
  if(techBtn){ev.preventDefault();window.learnTech(techBtn.getAttribute("data-tech"));return}
  var disBtn=ev.target.closest ? ev.target.closest(".dismantle-gear") : null;
  if(disBtn){ev.preventDefault();window.dismantleGear(Number(disBtn.getAttribute("data-index")));return}
  var conBtn=ev.target.closest ? ev.target.closest(".consign-gear") : null;
  if(conBtn){ev.preventDefault();window.openConsign(Number(conBtn.getAttribute("data-index")));return}
  var priceBtn=ev.target.closest ? ev.target.closest(".consign-price") : null;
  if(priceBtn){ev.preventDefault();window.confirmConsign(Number(priceBtn.getAttribute("data-index")),Number(priceBtn.getAttribute("data-price")));return}
  var destBtn=ev.target.closest ? ev.target.closest("[data-dest]") : null;
  if(destBtn){
    ev.preventDefault();
    var dest=destBtn.getAttribute("data-dest");
    window.move(dest);
    return;
  }
  var btn=ev.target.closest ? ev.target.closest("[data-action]") : null;
  if(!btn) return;
  ev.preventDefault();
  runAction(btn.getAttribute("data-action"));
});

function boot(){
 try{
   window.s=sanitizeState(load());
   merge(s,D);
   s=sanitizeState(s);
   offline();
   render();
   var v=document.getElementById("view");
   if(!v || !v.innerHTML.trim()) throw new Error("render() 後主畫面仍為空白");
 }catch(err){
   var v=document.getElementById("view");
   if(v){
     var msg=String(err&&err.message||err).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]});
     v.innerHTML='<div class="panel"><div class="title">啟動診斷</div><div class="story"><b>錯誤：</b> '+msg+'<br><br>請把這個畫面截圖給我。</div></div>';
   }
 }
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot);
else boot();
})();
</script></body></html>
